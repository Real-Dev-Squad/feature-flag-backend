Transform: 'AWS::Serverless-2016-10-31'
Globals:
  Function:
    Timeout: 10
    Environment:
      Variables:
        ENVIRONMENT: PRODUCTION
        RDS_BACKEND_PUBLIC_KEY_NAME: !If
          - IsProd
          - "PROD_RDS_BACKEND_PUBLIC_KEY"
          - "STAGING_RDS_BACKEND_PUBLIC_KEY"
        SESSION_COOKIE_NAME: !If
          - IsProd
          - "rds-session"
          - "rds-session-staging"
        CreateFeatureFlagFunction: !If
          - IsProd
          - FeatureFlagBackendProdLam-CreateFeatureFlagFunctio-YOVQpOQ9W4hR
          - feature-flag-staging-CreateFeatureFlagFunction-jtNqeZdpSPyX
        CorsLambda: !If
          - IsProd
          - feature-flag-staging-CorsLambda-2G87oYaH3fXJ
          - feature-flag-staging-CorsLambda-2G87oYaH3fXJ
        CreateUserFeatureFlagFunction: !If
          - IsProd
          - FeatureFlagBackendProdLam-CreateUserFeatureFlagFun-Fi1GnCD4KsBu
          - feature-flag-staging-CreateUserFeatureFlagFunction-STwgvxNezRhr
        GetFeatureFlagFunction: !If
          - IsProd
          - FeatureFlagBackendProdLambd-GetFeatureFlagFunction-I2kT1C4qt7i8
          - feature-flag-staging-GetFeatureFlagFunction-0J7rpugeOdU5
        GetAllFeatureFlagFunction: !If
          - IsProd
          - FeatureFlagBackendProdLam-GetAllFeatureFlagFunctio-kqYPpHWHnPqR
          - feature-flag-staging-GetAllFeatureFlagFunction-ey71dNmZRDOp
        UpdateFeatureFlagFunction: !If
          - IsProd
          - FeatureFlagBackendProdLam-UpdateFeatureFlagFunctio-9g8Vbr3cPzHL
          - feature-flag-staging-UpdateFeatureFlagFunction-Kyi46ClC6I4R
        UpdateUserFeatureFlagFunction: !If
          - IsProd
          - FeatureFlagBackendProdLam-UpdateUserFeatureFlagFun-FkeJ3SHwYIjo
          - feature-flag-staging-UpdateUserFeatureFlagFunction-CmettJMSor9w
        GetUserFeatureFlagsFunction: !If
          - IsProd
          - FeatureFlagBackendProdLam-GetUserFeatureFlagsFunct-Qj4UvchESEwz
          - feature-flag-staging-GetUserFeatureFlagsFunction-ajPGREFbovxq
        GetUserFeatureFlagFunction: !If
          - IsProd
          - FeatureFlagBackendProdLam-GetUserFeatureFlagFuncti-X4iHFCSiLo92
          - feature-flag-staging-GetUserFeatureFlagFunction-8NRHy9k0q5M4
        RateLimiterFunction: !If
          - IsProd
          - FeatureFlagBackendProdLambdas-RateLimiterFunction-WubbBb4Naxsm
          - feature-flag-staging-RateLimiterFunction-7tOfBleMOdAA

Conditions:
  IsProd: !Equals [!Ref Environment, "PRODUCTION"]

Parameters:
  Environment:
    Type: String
    Default: "PRODUCTION"
    AllowedValues:
      - "PRODUCTION"
      - "DEVELOPMENT"

Resources:
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: shared-utilities
      Description: Shared utilities, database, models, jwt, and middlewares for feature flag backend
      ContentUri: layer/
      CompatibleRuntimes:
        - provided.al2

  CorsLambda:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: corsLambda/
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: requestLimit
      Events:
        Preflight:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: OPTIONS

  HealthCheckFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: health-check/
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64  
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: featureFlag
        - DynamoDBCrudPolicy:
            TableName: featureFlagUserMapping
        - DynamoDBCrudPolicy:
            TableName: requestLimit
        - SSMParameterReadPolicy:
            ParameterName: PROD_RDS_BACKEND_PUBLIC_KEY
        - SSMParameterReadPolicy:
            ParameterName: STAGING_RDS_BACKEND_PUBLIC_KEY
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /health-check
            Method: GET

  RateLimiterFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: rateLimiterLambda/
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64  
      Layers:
        - !Ref SharedLayer
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:PutFunctionConcurrency
              Resource: '*'
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /mark-concurrency-zero
            Method: PATCH

  ResetLimitFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: resetLimitLambda/
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64  
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: requestLimit
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /reset-limit
            Method: POST

  GetFeatureFlagFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: getFeatureFlagById/
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: featureFlag
        - DynamoDBCrudPolicy:
            TableName: featureFlagUserMapping
        - DynamoDBCrudPolicy:
            TableName: requestLimit
        - SSMParameterReadPolicy:
            ParameterName: PROD_RDS_BACKEND_PUBLIC_KEY
        - SSMParameterReadPolicy:
            ParameterName: STAGING_RDS_BACKEND_PUBLIC_KEY
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /feature-flags/{flagId}
            Method: GET

  CreateFeatureFlagFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: createFeatureFlag/
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: featureFlag
        - DynamoDBCrudPolicy:
            TableName: featureFlagUserMapping
        - DynamoDBCrudPolicy:
            TableName: requestLimit
        - SSMParameterReadPolicy:
            ParameterName: PROD_RDS_BACKEND_PUBLIC_KEY
        - SSMParameterReadPolicy:
            ParameterName: STAGING_RDS_BACKEND_PUBLIC_KEY
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /feature-flags/
            Method: POST

  UpdateFeatureFlagFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: updateFeatureFlag/
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: featureFlag
        - DynamoDBCrudPolicy:
            TableName: featureFlagUserMapping
        - DynamoDBCrudPolicy:
            TableName: requestLimit
        - SSMParameterReadPolicy:
            ParameterName: PROD_RDS_BACKEND_PUBLIC_KEY
        - SSMParameterReadPolicy:
            ParameterName: STAGING_RDS_BACKEND_PUBLIC_KEY
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /feature-flags/{flagId}
            Method: PATCH

  GetAllFeatureFlagFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: getAllFeatureFlags/
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: featureFlag
        - DynamoDBCrudPolicy:
            TableName: featureFlagUserMapping
        - DynamoDBCrudPolicy:
            TableName: requestLimit
        - SSMParameterReadPolicy:
            ParameterName: PROD_RDS_BACKEND_PUBLIC_KEY
        - SSMParameterReadPolicy:
            ParameterName: STAGING_RDS_BACKEND_PUBLIC_KEY
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /feature-flags/
            Method: GET

  GetUserFeatureFlagFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: getUserFeatureFlag/
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: featureFlag
        - DynamoDBCrudPolicy:
            TableName: featureFlagUserMapping
        - DynamoDBCrudPolicy:
            TableName: requestLimit
        - SSMParameterReadPolicy:
            ParameterName: PROD_RDS_BACKEND_PUBLIC_KEY
        - SSMParameterReadPolicy:
            ParameterName: STAGING_RDS_BACKEND_PUBLIC_KEY
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /users/{userId}/feature-flags/{flagId}
            Method: GET

  GetUserFeatureFlagsFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: getUserFeatureFlags/
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: featureFlag
        - DynamoDBCrudPolicy:
            TableName: featureFlagUserMapping
        - DynamoDBCrudPolicy:
            TableName: requestLimit
        - SSMParameterReadPolicy:
            ParameterName: PROD_RDS_BACKEND_PUBLIC_KEY
        - SSMParameterReadPolicy:
            ParameterName: STAGING_RDS_BACKEND_PUBLIC_KEY
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /users/{userId}/feature-flags
            Method: GET   

  CreateUserFeatureFlagFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: createUserFeatureFlag/
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: featureFlag
        - DynamoDBCrudPolicy:
            TableName: featureFlagUserMapping
        - DynamoDBCrudPolicy:
            TableName: requestLimit
        - SSMParameterReadPolicy:
            ParameterName: PROD_RDS_BACKEND_PUBLIC_KEY
        - SSMParameterReadPolicy:
            ParameterName: STAGING_RDS_BACKEND_PUBLIC_KEY
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /users/{userId}/feature-flags/{flagId}
            Method: POST

  UpdateUserFeatureFlagFunction:
    Type: 'AWS::Serverless::Function'
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: updateUserFeatureFlag/
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: featureFlag
        - DynamoDBCrudPolicy:
            TableName: featureFlagUserMapping
        - DynamoDBCrudPolicy:
            TableName: requestLimit
        - SSMParameterReadPolicy:
            ParameterName: PROD_RDS_BACKEND_PUBLIC_KEY
        - SSMParameterReadPolicy:
